name: Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build
        run: ./gradlew --no-daemon :core:jvmTest :app:lintDebug :app:assembleRelease
      - name: Build Beta debug APK
        if: github.ref_type == 'tag' && contains(github.ref_name, '-beta.')
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Prepare and verify APK
        if: github.ref_type == 'tag'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/sign-apk.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: android-release-apk
          path: app/build/release-artifacts/*.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-release-apk
          path: release
      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_options=(--verify-tag --generate-notes --title "一心 Android $version")
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/*.apk "${release_options[@]}"
