name: Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.apk.outputs.release_tag }}
    env:
      ORG_GRADLE_PROJECT_ciBuildNumber: ${{ github.run_number }}
      ORG_GRADLE_PROJECT_ciBetaBuild: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build
        run: ./gradlew --no-daemon :core:jvmTest :app:lintDebug :app:assembleRelease
      - name: Build Beta debug APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || contains(github.ref_name, '-beta.'))
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Prepare and verify APK
        id: apk
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            bash scripts/sign-apk.sh "$GITHUB_REF_NAME"
          else
            bash scripts/sign-apk.sh
          fi
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: android-release-apk
          path: app/build/release-artifacts/*.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    if: github.event_name == 'push' && needs.build.outputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-release-apk
          path: release
      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          release_options=(--generate-notes --title "一心 Android $version")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            release_options+=(--verify-tag)
          else
            release_options+=(--target "$GITHUB_SHA")
          fi
          if [[ "$GITHUB_REF_TYPE" != tag || "$RELEASE_TAG" == *-beta.* ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release/*.apk "${release_options[@]}"
